id: emergency
namespace: safety

description: |
  Trinetra safety pipeline: parse → AI agent generates alert → notify_family
  → wait → check acknowledgement → escalate → summary.
  On any failure → notify_failure.

labels:
  project: trinetra
  category: safety

inputs:
  - id: name
    type: STRING
    defaults: User
  - id: destination
    type: STRING
    defaults: Home
  - id: emergency_trigger
    type: STRING
    defaults: voice
  - id: latitude
    type: FLOAT
    defaults: 12.9716
  - id: longitude
    type: FLOAT
    defaults: 77.5946
  - id: maps_url
    type: STRING
    defaults: "https://maps.google.com/?q=12.9716,77.5946"
  - id: event_timestamp
    type: STRING
    defaults: "2026-05-14T23:15:00Z"

variables:
  personName: "{{ trigger.body.name ?? inputs.name }}"
  personDestination: "{{ trigger.body.destination ?? inputs.destination }}"
  triggerType: "{{ trigger.body.trigger ?? inputs.emergency_trigger }}"
  eventTime: "{{ trigger.body.timestamp ?? inputs.event_timestamp }}"
  mapsUrl: "{{ trigger.body.location.mapsUrl ?? inputs.maps_url ?? ('https://maps.google.com/?q=' ~ (trigger.body.location.latitude ?? inputs.latitude) ~ ',' ~ (trigger.body.location.longitude ?? inputs.longitude)) }}"

tasks:
  - id: parse_emergency
    type: io.kestra.plugin.core.log.Log
    description: Read emergency payload from inputs or webhook.
    message: |
      [Trinetra] Emergency received
      Name: {{ vars.personName }} | Trigger: {{ vars.triggerType }}
      Destination: {{ vars.personDestination }} | Time: {{ vars.eventTime }}
      Location: {{ vars.mapsUrl }}

  - id: generate_alert_message
    type: io.kestra.plugin.scripts.python.Script
    description: AI agent writes the emergency alert. KV key GROQ_API_KEY (get key at console.groq.com/keys).
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - requests
      - kestra
    env:
      GROQ_API_KEY: "{{ kv('GROQ_API_KEY') }}"
    script: |
      import os
      import requests
      from kestra import Kestra

      name = """{{ vars.personName }}"""
      trigger_type = """{{ vars.triggerType }}"""
      destination = """{{ vars.personDestination }}"""
      timestamp = """{{ vars.eventTime }}"""
      maps_url = """{{ vars.mapsUrl }}"""

      def fallback_alert():
          return (
              f"EMERGENCY: {name} may be in danger ({trigger_type} alert) while heading to "
              f"{destination}. She needs help now. Live location for emergency contacts: {maps_url}"
          )

      prompt = (
          "Write ONE urgent alert (max 55 words) for family/emergency contacts.\n"
          "MUST include:\n"
          "1) Person may be IN DANGER and needs immediate help (not safe, not arrived).\n"
          "2) Trigger type and that they were traveling toward destination.\n"
          "3) The exact live location URL on its own line prefixed with 'Location:'\n"
          "4) Ask contacts to open the link and respond urgently.\n"
          "NEVER say she arrived, is safe, or will reach home soon.\n\n"
          f"Name: {name}\nTrigger: {trigger_type}\nHeading to: {destination}\n"
          f"Time (UTC): {timestamp}\nLive location URL: {maps_url}"
      )

      api_key = os.environ.get("GROQ_API_KEY", "").strip()
      alert_message = ""
      source = "ai_agent"

      if api_key:
          for model in ["llama-3.1-8b-instant", "llama-3.3-70b-versatile"]:
              try:
                  resp = requests.post(
                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Content-Type": "application/json",
                      },
                      json={
                          "model": model,
                          "messages": [
                              {
                                  "role": "system",
                                  "content": (
                                      "You are Trinetra, a women's safety AI agent. "
                                      "Write urgent emergency alerts. The person is at risk—"
                                      "never imply they are safe or have arrived. "
                                      "Always include the live location URL for emergency contacts."
                                  ),
                              },
                              {"role": "user", "content": prompt},
                          ],
                          "max_tokens": 150,
                          "temperature": 0.4,
                      },
                      timeout=45,
                  )
                  resp.raise_for_status()
                  alert_message = (
                      resp.json()["choices"][0]["message"]["content"] or ""
                  ).strip()
                  if alert_message:
                      print(f"AI agent model: {model}")
                      break
              except Exception as exc:
                  print(f"AI agent error ({model}): {exc}")
      else:
          print("GROQ_API_KEY not set — using fallback template (no AI agent).")

      if not alert_message:
          alert_message = fallback_alert()
          source = "fallback_template"

      print(alert_message)
      Kestra.outputs({"alertMessage": alert_message, "source": source})

  - id: notify_family
    type: io.kestra.plugin.core.log.Log
    description: Simulated SMS / push / email to trusted contacts.
    message: |
      [Trinetra] Notifying trusted contacts (simulated)
      {{ outputs.generate_alert_message.vars.alertMessage }}

      Share with emergency contacts — live location:
      {{ vars.mapsUrl }}

  - id: wait_for_acknowledgement
    type: io.kestra.plugin.core.flow.Sleep
    duration: PT60S

  - id: check_acknowledgement_status
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    dependencies:
      - kestra
    env:
      TRINETRA_SIMULATE_ACK: "{{ kv('TRINETRA_SIMULATE_ACK', 'safety', false) ?? '' }}"
    script: |
      import json
      import os
      from kestra import Kestra

      ack = os.environ.get("TRINETRA_SIMULATE_ACK", "").strip().lower()
      acknowledged = ack in {"1", "true", "yes", "y", "on"}
      result = {"acknowledged": acknowledged, "source": "simulated"}
      print(json.dumps(result))
      Kestra.outputs(result)

  - id: escalate_if_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_acknowledgement_status.vars.acknowledged != true }}"
    then:
      - id: escalate_alert
        type: io.kestra.plugin.core.log.Log
        message: |
          [Trinetra] ESCALATION — no acknowledgement within 60 seconds
          {{ vars.personName }} may still be IN DANGER. Re-contact emergency contacts immediately.
          {{ outputs.generate_alert_message.vars.alertMessage }}

          Live location (share now): {{ vars.mapsUrl }}

  - id: send_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      [Trinetra] Run complete
      Person: {{ vars.personName }} | Trigger: {{ vars.triggerType }} | Status: emergency handled
      Acknowledged: {{ outputs.check_acknowledgement_status.vars.acknowledged }}
      Alert: {{ outputs.generate_alert_message.vars.alertMessage }}
      Location link for contacts: {{ vars.mapsUrl }}

outputs:
  - id: alertMessage
    type: STRING
    value: "{{ outputs.generate_alert_message.vars.alertMessage }}"
  - id: acknowledged
    type: BOOLEAN
    value: "{{ outputs.check_acknowledgement_status.vars.acknowledged }}"
  - id: escalated
    type: BOOLEAN
    value: "{{ outputs.check_acknowledgement_status.vars.acknowledged != true }}"

errors:
  - id: notify_failure
    type: io.kestra.plugin.core.log.Log
    message: |
      [Trinetra] WORKFLOW FAILED
      Failed task: {{ error.taskId ?? 'unknown' }}
      Error: {{ error.message ?? 'No details' }}
      Person: {{ vars.personName }} | Location: {{ vars.mapsUrl }}

triggers:
  - id: emergency_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: emergency
